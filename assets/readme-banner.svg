<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">GitPulse</title><desc id="d">An animated activity heatmap and commit history pulse.</desc><defs><linearGradient id="bg"><stop stop-color="#152b3a"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g transform="translate(100 95)" fill="#173b43"><rect width="34" height="34" rx="6"/><rect x="44" width="34" height="34" rx="6" fill="#28645c"/><rect x="88" width="34" height="34" rx="6" fill="#62e3c1"/><rect y="44" width="34" height="34" rx="6" fill="#28645c"/><rect x="44" y="44" width="34" height="34" rx="6" fill="#62e3c1"/><rect x="88" y="44" width="34" height="34" rx="6"/><rect y="88" width="34" height="34" rx="6" fill="#62e3c1"/><rect x="44" y="88" width="34" height="34" rx="6"/><rect x="88" y="88" width="34" height="34" rx="6" fill="#28645c"/></g><path d="M360 180L440 180L500 120L570 200L640 135L710 160L780 90L850 155L930 120L1050 120" fill="none" stroke="#62e3c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" values="900;0;0" dur="5s" repeatCount="indefinite"/></path><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">GITPULSE</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">ACTIVITY / STREAKS / HOT FILES</text></svg>